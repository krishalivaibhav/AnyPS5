name: Focused PR readiness validation
on:
  push:
    branches: [codex/pr-readiness-validation]
permissions:
  contents: read
concurrency:
  group: pr-readiness-validation
  cancel-in-progress: true
jobs:
  focused:
    name: PR ${{ matrix.pr }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pr: 5073
            os: windows-latest
            sha: 3c0fa76211cc3c4f7e65d9454f00b01d22c8fc47
            targets: guest_memory_tests windows_write_watch_tests
            filter: ^(guest_memory|windows_write_watch)$
            control: ''
            control_filter: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      TARGETS: ${{ matrix.targets }}
      FILTER: ${{ matrix.filter }}
      CONTROL_FILES: ${{ matrix.control }}
      CONTROL_FILTER: ${{ matrix.control_filter }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 2
          submodules: true
          persist-credentials: false
      - name: Record exact tested source
        run: |
          test "$(git rev-parse HEAD)" = '${{ matrix.sha }}'
          git show -s --format=fuller HEAD | tee source.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers libpipewire-0.3-dev libpulse-dev libasound2-dev libxrandr-dev
      - if: runner.os == 'Windows'
        id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: runner.os == 'Windows' && steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - if: runner.os == 'Windows'
        run: |
          echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
          echo 'SSL_CERT_FILE=C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt' >> "$GITHUB_ENV"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: readiness-${{ matrix.pr }}-${{ runner.os }}
          save: false
      - name: Configure actual runtime and build focused targets
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DANYPS5_ENABLE_SPIRV_TOOLS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target $TARGETS --parallel 2
      - name: Repeat candidate runtime tests
        run: |
          ctest --test-dir build -R "$FILTER" --no-tests=error --output-on-failure --repeat until-fail:3 --timeout 30 --output-log candidate.log --output-junit candidate.xml
          python3 -c "import xml.etree.ElementTree as E; r=E.parse('build/candidate.xml').getroot(); assert len(list(r.iter('testcase')))==2, 'expected memory and Windows write-watch tests'; assert not list(r.iter('skipped')), 'skipped tests are not validation'"
      - name: Production-only negative control and restoration
        if: matrix.control != ''
        run: |
          git checkout HEAD^ -- $CONTROL_FILES
          cmake --build build --target $TARGETS --parallel 2
          set +e
          ctest --test-dir build -R "$CONTROL_FILTER" --no-tests=error --output-on-failure --timeout 30 --output-log negative-control.log --output-junit negative-control.xml
          result=$?
          set -e
          test "$result" -ne 0
          python3 -c "import os, xml.etree.ElementTree as E; r=E.parse('build/negative-control.xml').getroot(); c=list(r.iter('testcase')); expected=os.environ['CONTROL_FILTER'].strip('^$'); assert len(c)==1 and c[0].get('name')==expected, 'negative control did not run its expected test'; assert c[0].find('failure') is not None and c[0].find('skipped') is None, 'negative control did not fail'; text=E.tostring(c[0],encoding='unicode').lower(); assert 'load failed' not in text and 'timeout' not in text, 'infrastructure failure is not a lifetime reproduction'"
          git checkout HEAD -- $CONTROL_FILES
          cmake --build build --target $TARGETS --parallel 2
          ctest --test-dir build -R "$FILTER" --no-tests=error --output-on-failure --repeat until-fail:3 --timeout 30 --output-log restored-candidate.log --output-junit restored-candidate.xml
          python3 -c "import xml.etree.ElementTree as E; r=E.parse('build/restored-candidate.xml').getroot(); assert list(r.iter('testcase')) and not list(r.iter('skipped')), 'missing or skipped restored tests'"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: readiness-${{ matrix.pr }}-${{ runner.os }}
          path: |
            source.txt
            build/negative-control.xml
            build/restored-candidate.xml
            write-watch/write-watch.xml
            build/candidate.xml
            build/candidate.log
            build/negative-control.log
            build/restored-candidate.log
            write-watch/write-watch.log
            candidate.log
            negative-control.log
            restored-candidate.log
            write-watch.log
            build/CMakeFiles/CMakeConfigureLog.yaml
